# Italian Receipt Template (Scontrino Fiscale)
# Matches Italian fiscal receipts with IVA

issuer: Italian Receipt
fields:
  # Merchant/Store name
  merchant:
    parser: regex
    regex: ^([A-Z][A-Za-z\s&\'\-\.]{2,50})$
    type: str
    group: 1

  # Total (Totale)
  amount:
    parser: regex
    regex: (?:totale|tot\.?|importo|totale\s*euro)[\s:€]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Subtotal
  subtotal:
    parser: regex
    regex: (?:subtotale|sub\s*tot\.?|imponibile)[\s:€]*(\d+[.,]\d{2})
    type: float
    group: 1

  # IVA (VAT)
  tax:
    parser: regex
    regex: (?:iva|i\.v\.a\.)[\s:€]*(\d+[.,]\d{2})
    type: float
    group: 1

  # VAT Rate
  vat_rate:
    parser: regex
    regex: (?:iva|aliquota)[\s:]*(\d+)%
    type: float
    group: 1

  # Partita IVA (VAT Number)
  vat_number:
    parser: regex
    regex: (?:p\.?\s*iva|partita\s*iva)[\s:]*(\d{11})
    type: str
    group: 1

  # Date
  date:
    parser: regex
    regex: (\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})
    type: date

  # Receipt number (Scontrino)
  invoice_number:
    parser: regex
    regex: (?:scontrino|documento|nr\.?)[\s#:]*(\d+)
    type: str
    group: 1

  # Payment method
  payment_method:
    parser: regex
    regex: (contanti|carta|bancomat|pos|contante|credito)
    type: str
    group: 1

keywords:
  - totale
  - iva
  - scontrino
  - fiscale
  - partita
  - imponibile
  - euro

# Line items
lines:
  start: (?:---+|descrizione|articolo)
  end: (?:totale|subtotale|---+)
  line: (?P<description>[A-Za-z][\w\s\-]+)\s+(?P<price>\d+[.,]\d{2})

options:
  currency: EUR
  decimal_separator: ','
  date_formats:
    - '%d/%m/%Y'
    - '%d-%m-%Y'
    - '%d.%m.%Y'
