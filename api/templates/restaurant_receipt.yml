# Restaurant Receipt Template
# Matches restaurant, cafe, and food service receipts

issuer: Restaurant
fields:
  # Restaurant name
  merchant:
    parser: regex
    regex: ^([A-Z][A-Za-z\s&\'\-]{2,40})$
    type: str
    group: 1

  # Total
  amount:
    parser: regex
    regex: (?:total|totale|grand\s*total|amount\s*due|balance\s*due)[\s:€$£]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Tip
  tip:
    parser: regex
    regex: (?:tip|gratuity|mancia|service)[\s:€$£]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Subtotal before tax/tip
  subtotal:
    parser: regex
    regex: (?:subtotal|sub\s*total)[\s:€$£]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Tax
  tax:
    parser: regex
    regex: (?:tax|iva|vat)[\s:€$£]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Date
  date:
    parser: regex
    regex: (\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})
    type: date

  # Table number
  table:
    parser: regex
    regex: (?:table|tavolo)[\s#:]*(\d+)
    type: str
    group: 1

keywords:
  - restaurant
  - ristorante
  - cafe
  - bar
  - table
  - server
  - tip
  - gratuity

# Menu items
lines:
  start: (?:---+|order|items)
  end: (?:subtotal|total|---+)
  line: (?P<qty>\d+)?\s*[x@]?\s*(?P<description>[A-Za-z][\w\s\-]+)\s+(?P<price>\d+[.,]\d{2})

options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
    - '%d-%m-%Y'
    - '%m/%d/%Y'
