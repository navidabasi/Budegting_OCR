# Grocery Store Receipt Template
# Matches supermarket and grocery store receipts

issuer: Grocery Store
fields:
  # Store name (usually first line)
  merchant:
    parser: regex
    regex: ^([A-Z][A-Za-z\s&\'-]{2,40})$
    type: str
    group: 1

  # Total with various keywords
  amount:
    parser: regex
    regex: (?:total|totale|tot\.|grand\s*total|amount\s*due)[\s:€$£]*(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})
    type: float
    group: 1

  # Tax/VAT
  tax:
    parser: regex
    regex: (?:tax|iva|vat|mwst)[\s:€$£]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Date
  date:
    parser: regex
    regex: (\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})
    type: date

  # Receipt/transaction number
  invoice_number:
    parser: regex
    regex: (?:receipt|scontrino|ticket|trans)[\s#:]*(\d+)
    type: str
    group: 1

keywords:
  - grocery
  - supermarket
  - market
  - store
  - subtotal
  - qty

# Line items extraction
lines:
  start: (?:---+|item|description)
  end: (?:subtotal|total|---+)
  line: (?P<description>[A-Za-z][\w\s\-]+)\s+(?P<qty>\d+)?\s*[@x]?\s*(?P<price>\d+[.,]\d{2})

options:
  currency: EUR
  decimal_separator: ','
  date_formats:
    - '%d/%m/%Y'
    - '%d-%m-%Y'
    - '%d.%m.%Y'
