issuer: Carrefour
keywords:
  - Carrefour
  - GS S.p.A.
  - www.carrefour.it
fields:
  amount:
    regex: (?:TOTALE|TOTALE DOVUTO)\s+([0-9]+[,.][0-9]{2})
    type: float
  date:
    regex: (\d{2}/\d{2}/\d{2,4})
    type: date
lines:
  start: (DESCRIZIONE|ARTICOLO)
  end: TOTALE
  line: ^(?P<description>.+?)\s+(?P<price>[0-9]+[,.][0-9]{2})$
