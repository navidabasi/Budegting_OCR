# Gas Station Receipt Template
# Matches fuel/petrol station receipts

issuer: Gas Station
fields:
  # Station name
  merchant:
    parser: regex
    regex: ^((?:shell|bp|esso|total|eni|agip|q8|ip|tamoil|gulf)[A-Za-z\s\-]*)$
    type: str
    group: 1

  # Total amount
  amount:
    parser: regex
    regex: (?:total|totale|amount|importo)[\s:€$£]*(\d+[.,]\d{2})
    type: float
    group: 1

  # Fuel quantity (liters)
  quantity:
    parser: regex
    regex: (?:liters?|litri|l\.|qty)[\s:]*(\d+[.,]\d{2,3})
    type: float
    group: 1

  # Price per liter
  unit_price:
    parser: regex
    regex: (?:€\/l|price\/l|prezzo\/l)[\s:]*(\d+[.,]\d{3})
    type: float
    group: 1

  # Fuel type
  fuel_type:
    parser: regex
    regex: (diesel|benzina|gasolio|unleaded|super|premium|lpg|gpl)
    type: str
    group: 1

  # Pump number
  pump:
    parser: regex
    regex: (?:pump|pompa|dispenser)[\s#:]*(\d+)
    type: str
    group: 1

  # Date
  date:
    parser: regex
    regex: (\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})
    type: date

keywords:
  - fuel
  - benzina
  - diesel
  - gasolio
  - liters
  - litri
  - pump
  - station

options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
    - '%d-%m-%Y'
