issuer: Lidl
keywords:
  - Lidl Italia
  - PI02275030233
  - DOCUMENTO COMMERCIALE
  - socio unico
fields:
  amount:
    regex: TOTALE\s+(?:COMPLESSIVO\s+)?(?:EUR\s+)?([0-9]+[,.\s][0-9]{2})
    type: float
  date:
    regex: (\d{2}-\d{2}-\d{4}|\d{2}/\d{2}/\d{4})
    type: date
  vat:
    regex: PI(\d{11})
    type: static
    value: 02275030233
lines:
  start: (DESCRIZIONE|DESCRIZTONE|PREZZO)
  end: (SUBTOTALE|TOTALE)
  # Match: ITEM_NAME + optional VAT% + PRICE
  # Examples: "10UOVA M SENZA ANTIB    10%    2,79"
  line: ^(?P<description>.+?)\s+(?:\d{1,2}%\s+)?(?P<price>[0-9]+[,.\s][0-9]{2})\s*$
  skip_line: (EUR/kg|Cad\.|kg\s*x|DESCRIZIONE|PREZZO|IVA)
