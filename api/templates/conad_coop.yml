issuer: Conad_Coop_Generic
keywords:
  - CONAD
  - COOP
  - P.IVA
fields:
  amount:
    regex: (?:TOTALE|EURO)\s+([0-9]+[,.][0-9]{2})
    type: float
  date:
    regex: (\d{2}/\d{2}/\d{2,4})
    type: date
lines:
  start: (DESCRIZIONE|PRODOTTO)
  end: (TOTALE|PAGAMENTO)
  line: ^(?P<description>.+?)\s+(?P<price>[0-9]+[,.][0-9]{2})$
