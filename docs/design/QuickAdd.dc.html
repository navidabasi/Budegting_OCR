<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add — new expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Albert+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#F4F6F3;color:#10211B;font-family:'Albert Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00573F;text-decoration:none}a:hover{color:#003D2C}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','Albert Sans',sans-serif}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid #D6DDD8;background:#FFFFFF;font:inherit;font-size:14px;font-weight:500;color:#10211B;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#10211B;border-color:#10211B;color:#FFFFFF}
.chip.sug{border-color:#00573F;color:#00573F}
.key{height:56px;border-radius:16px;border:0;background:#FFFFFF;font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:500;color:#10211B;box-shadow:0 1px 2px rgba(16,33,27,.06)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: #B9C4BE; overflow: hidden; position: relative">

  <!-- Dimmed page behind the sheet -->
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 160px; padding: 56px 20px 0; opacity: .5">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #10211B">Where my money went</span>
    <div class="disp" style="font-size: 32px; font-weight: 700; color: #10211B">November</div>
  </div>

  <!-- Bottom sheet -->
  <div style="background: #F4F6F3; border-radius: 28px 28px 0 0; padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 30px rgba(16,33,27,.18)">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #C9D1CC; align-self: center"></div>

    <!-- Header row: type + scan shortcuts -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; background: #E4E9E5; border-radius: 14px; padding: 3px; gap: 2px">
        <button style="height: 38px; padding: 0 14px; border-radius: 11px; border: 0; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #10211B; box-shadow: 0 1px 2px rgba(16,33,27,.1)">Expense</button>
        <button style="height: 38px; padding: 0 14px; border-radius: 11px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #1B7F55">Income</button>
        <button style="height: 38px; padding: 0 14px; border-radius: 11px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #2458D6">Savings</button>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="ScanReview.dc.html" aria-label="Scan a receipt with the camera" style="width: 44px; height: 44px; border-radius: 14px; background: #00573F; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </a>
        <a href="ScanReview.dc.html" aria-label="Pick a receipt photo or PDF" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D6DDD8; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        </a>
      </div>
    </div>

    <!-- Amount -->
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 6px 0 0">
      <span class="mono" style="font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1">12,40</span>
      <span class="mono" style="font-size: 22px; color: #5C6B64">€</span>
    </div>

    <!-- Merchant -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="merchant" style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5C6B64">Where</label>
      <input id="merchant" type="text" value="Bar Roma" style="height: 48px; border-radius: 14px; border: 1px solid #D6DDD8; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #10211B">
      <div style="display: flex; gap: 8px; overflow: hidden">
        <button class="chip">Lidl</button>
        <button class="chip">Conad</button>
        <button class="chip">Esselunga</button>
        <button class="chip">Trenitalia</button>
        <button class="chip">Farmacia</button>
      </div>
    </div>

    <!-- Category + date + account -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5C6B64">Category · suggested first</span>
      <div style="display: flex; gap: 8px; overflow: hidden">
        <button class="chip on">Dining</button>
        <button class="chip">Groceries</button>
        <button class="chip">Transport</button>
        <button class="chip">Shopping</button>
        <button class="chip">More</button>
      </div>
      <div style="display: flex; gap: 8px; overflow: hidden">
        <button class="chip on">Today</button>
        <button class="chip">Yesterday</button>
        <button class="chip"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Pick</button>
        <span style="width: 1px; background: #D6DDD8; margin: 6px 2px"></span>
        <button class="chip">Revolut</button>
        <button class="chip">Cash</button>
      </div>
    </div>

    <!-- More -->
    <button style="height: 44px; border-radius: 14px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #00573F; display: flex; align-items: center; justify-content: center; gap: 6px">
      More: items, notes, group, tags, split, recurring, planned
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>

    <!-- Keypad -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key" aria-label="Delete last digit" style="font-size: 18px">⌫</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key" style="font-size: 18px; color: #5C6B64">+</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <a href="Main.dc.html" style="grid-row: span 2; border-radius: 16px; background: #00573F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save</a>
      <button class="key">,</button><button class="key">0</button><button class="key">00</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
