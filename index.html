<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Manage your receipts and expenses with OCR" />
    <title>Receipt Manager</title>
</head>

<body>
    <div id="root">
        <div style="padding: 20px; font-family: sans-serif; background: #f0f0f0;">
            <h1>Loading React App...</h1>
            <p id="status">Initializing...</p>
        </div>
    </div>
    <script>
        console.log('HTML loaded, starting React...');
        document.getElementById('status').textContent = 'Loading JavaScript modules...';
        
        // Catch any unhandled errors
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = 'ERROR: ' + (event.error?.message || event.message);
                statusEl.style.color = 'red';
            }
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = 'PROMISE ERROR: ' + (event.reason?.message || event.reason);
                statusEl.style.color = 'red';
            }
        });
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
